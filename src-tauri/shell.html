<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>채소ZIP</title>
    <style>
      html {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafafa;
        color: #262626;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main {
        padding: 32px;
        text-align: center;
      }
      .brand {
        color: #d94400;
        font-weight: 700;
      }
      h1 {
        font-size: 24px;
        line-height: 1.5;
        word-break: keep-all;
      }
      p {
        color: #525252;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 24px;
        border-radius: 8px;
        background: #262626;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #d94400;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">채소ZIP</p>
      <h1>{{title}}</h1>
      <p>{{description}}</p>
      <a href="chaeso-shell://localhost/loading">다시 시도</a>
    </main>
  </body>
</html>
