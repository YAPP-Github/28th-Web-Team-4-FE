pre-commit:
  parallel: true
  commands:
    lint:
      run: ./node_modules/.bin/oxlint --type-aware --no-error-on-unmatched-pattern {staged_files} && git add {staged_files}
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
    format:
      run: ./node_modules/.bin/oxfmt --check --no-error-on-unmatched-pattern {staged_files} && git add {staged_files}
