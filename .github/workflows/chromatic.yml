name: 'Chromatic'

on:
  workflow_dispatch:

# 같은 ref에서 연속 수동 실행 시 이전 빌드를 취소해 스냅샷 쿼터 절약
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  chromatic:
    name: Storybook Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/pnpm-setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          buildScriptName: build-storybook
          # TurboSnap — 변경된 스토리만 스냅샷 (쿼터 절약)
          onlyChanged: true
          # main 머지 시 변경을 자동 승인 → 새 베이스라인으로 확정
          autoAcceptChanges: 'main'
          # 비주얼 변경이 있어도 CI를 블록하지 않고 Chromatic에서 리뷰
          exitZeroOnChanges: true
          # 드래프트 PR · dependabot/renovate PR은 건너뜀
          skip: ${{ github.event.pull_request.draft == true || startsWith(github.head_ref, 'renovate/') || startsWith(github.head_ref, 'dependabot/') }}
