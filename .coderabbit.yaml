language: 'ko-KR'
early_access: false
reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - '!design-tokens/**'
    - '!src/styles/tokens/**'
    # AI harness (app 코드 리뷰 신호 아님)
    - '!.agents/**'
    - '!.claude/**'
    - '!.cursor/**'
    - '!shared/skills/**'
    - '!shared/rules/**'
    - '!AGENTS.md'
    - '!CLAUDE.md'
    - '!docs/**'
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - '디자인 토큰'
chat:
  auto_reply: true
